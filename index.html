:root{color-scheme:dark;--bg:#0a0916;--panel:#100e20;--line:#25214a;--ink:#e9e7f6;--dim:#8d89ad;--cyan:#c2ecff;--red:#c8405a;--red2:#7e1f38}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "PixKR",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.mono{font-family:"PixMono","PixKR",monospace;font-variant-numeric:tabular-nums}
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,27vw,400px)}
.main{display:flex;flex-direction:column;padding:clamp(12px,2.4vw,36px);gap:clamp(8px,1.6vh,18px);min-height:0}
.status{display:flex;justify-content:space-between;align-items:center;color:var(--dim);min-height:22px}
.status .dot{display:inline-block;width:8px;height:8px;margin-right:8px;background:#3a3566;vertical-align:1px}
.status.run .dot{background:#5fd0ff;box-shadow:0 0 8px #5fd0ff}
.status.pause .dot{background:var(--red)}
.status.lock .dot{background:#ff3355;box-shadow:0 0 10px #ff3355}
.status.lock #state{color:#ff8a9c}
.status .right{display:flex;align-items:center;gap:12px}
.guard.on{color:#c2ecff;border-color:#2e86b6}
.rule{color:var(--dim)}
.rule b{font-weight:400;color:#ff8a9c}
.flash{position:fixed;inset:0;pointer-events:none;background:#ff1e46;opacity:0;z-index:5}
.flash.on{animation:fl 2s steps(1,end)}
@keyframes fl{0%,25%,50%,75%{opacity:.28}12.5%,37.5%,62.5%,87.5%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash.on{animation:none;opacity:.14}}
.camrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.camrow video{width:64px;height:48px;object-fit:cover;transform:scaleX(-1);background:#05040c;border:2px solid #2b2758;display:block;flex:none}
.camrow video.off{opacity:.25}
.camst{display:flex;flex-direction:column;gap:5px;flex:1;min-width:10em}
.camst span{color:var(--dim)}
.camst.ok span{color:#c2ecff}
.camst.bad span{color:#ff8a9c}
.meter{height:6px;width:min(140px,100%);background:#1d1a3a}
.meter i{display:block;height:100%;width:0;background:#5fd0ff}
.camst.bad .meter i{background:#ff3355}
.camrow .chip{min-height:40px}
.camrow .chip.main{color:var(--ink);border-color:#3a3570}
@media (max-height:520px){.camrow video{width:48px;height:36px}.camrow .chip{min-height:36px}}

.digits{flex:1;position:relative;min-height:90px}
.digits canvas{position:absolute;inset:0;width:100%;height:100%}
.ctrl{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:#19163a;border:2px solid #3a3570;min-height:48px;padding:0 18px;cursor:pointer;box-shadow:4px 4px 0 #04030b;border-radius:0;touch-action:manipulation}
button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #04030b}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
.go{background:var(--red2);border-color:var(--red);min-width:8.5em}
.go.on{background:#0f2c40;border-color:#2e86b6}
.warn{border-color:var(--red);color:#ffb3c0}
.ghost{margin-left:auto;background:transparent}
.laps{list-style:none;margin:0;padding:6px 0 0;border-top:2px solid var(--line);max-height:26vh;overflow:auto}
.laps li{display:grid;grid-template-columns:4.5em minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:baseline;padding:3px 2px;color:var(--dim)}
.laps li .mono{font-size:22px;text-align:right;color:var(--ink);white-space:nowrap}
.laps li .mono.sp{color:var(--cyan)}
.laps li:first-child .mono{color:#fff}
.laps .empty{display:block;color:#5e5a80;padding:4px 2px}
.side{background:var(--panel);border-left:2px solid var(--line);display:flex;flex-direction:column;padding:clamp(12px,1.6vw,22px);gap:8px;min-height:0}
.clock{display:flex;align-items:baseline;gap:4px;line-height:1}
.clock b{font-weight:400;font-size:44px;color:#fff}
.clock span{font-size:22px;color:var(--dim)}
.date{color:var(--dim)}
.scene{flex:1;min-height:0;display:grid;place-items:center;padding:0;background:transparent;border:0;box-shadow:none;cursor:pointer}
.scene:active{transform:none;box-shadow:none}
.scene canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid #2b2758;box-shadow:0 0 0 2px #06050e,6px 6px 0 #04030b}
.cap{color:#c9c5e6;text-align:center;min-height:21px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{min-height:36px;padding:0 10px;box-shadow:none;border-width:2px;background:transparent;color:var(--dim)}
.chip.pv{color:#ffd27a;border-color:#7a6230}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;background:#2e2a5a}
.dots i.on{background:var(--cyan)}
.today{border-top:2px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--dim)}
.today b{font-weight:400;font-size:22px;color:var(--cyan);white-space:nowrap}
@media (max-height:520px){
  .clock b{font-size:33px}.clock span{font-size:22px}
  .laps{max-height:20vh}.laps li .mono{font-size:22px}
  button{min-height:44px}.date,.cap,.rule{display:none}.side{gap:6px}
}
@media (max-aspect-ratio:1/1){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,44vh)}
  .side{border-left:0;border-top:2px solid var(--line)}
  .laps{max-height:16vh}.ghost{margin-left:0}
}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="status" id="status"><span><i class="dot"></i><span id="state">대기</span></span><span class="right"><span id="lapcount"></span><button class="chip guard" id="guard">딴짓 감지 켬</button></span></div>
    <div class="camrow">
      <video id="cv" class="off" muted playsinline autoplay></video>

      <button class="chip" id="calB" hidden>기준 다시 잡기</button>
      <button class="chip" id="sensB" hidden>감도 보통</button>
      <button class="chip main" id="camB">캠 켜기</button>
    </div>
    <div class="digits"><canvas id="dc" aria-label="경과 시간"></canvas></div>
    <div class="ctrl">
      <button id="go" class="go">시작</button>
      <button id="lap">랩</button>
      <button id="reset">리셋</button>

    <ol class="laps" id="laps"></ol>
  </main>
  <aside class="side">

    <div class="date" id="date"></div>

    <div class="cap" id="cap"></div>
    <div class="meta"><button class="chip" id="period" aria-label="다른 시간대 미리보기">밤</button><span class="dots" id="dots"></span></div>
    <div class="today"><span>오늘 누적</span><b class="mono" id="today">00:00:00</b></div>

  </aside>
</div>

{
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=ms=>{const s=Math.floor(Math.max(0,ms)/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)};
const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const DOW='일월화수목금토';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 상태 저장 ---------- */
const KEY='ame-stopwatch-v1';
let S={running:false,startAt:0,acc:0,laps:[],today:{date:dayKey(new Date()),ms:0},lastTick:0,scene:0,guard:true,locked:false,lockUntil:0};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const elapsed=now=>S.acc+(S.running?now-S.startAt:0);
function tickToday(now){
  if(!S.running){S.lastTick=now;return}
  const d=new Date(now),k=dayKey(d);
  let delta=Math.max(0,now-(S.lastTick||now));
  if(S.today.date!==k){const mid=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();S.today={date:k,ms:0};delta=Math.min(delta,now-mid)}
  S.today.ms+=delta;S.lastTick=now;
}
const todayMs=now=>S.today.date===dayKey(new Date(now))?S.today.ms:0;

/* ---------- 화면 켜두기 ---------- */
let lock=null;
async function wake(on){
  try{
    if(on&&!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}
    else if(!on&&lock){await lock.release();lock=null}
  }catch(e){}
}

/* ---------- 조작 ---------- */
const goB=$('#go'),lapB=$('#lap'),resetB=$('#reset'),fsB=$('#fs');
let armTimer=0;
function start(){const n=Date.now();S.locked=false;S.running=true;S.startAt=n;S.lastTick=n;save();wake(true);ui()}
function pause(){const n=Date.now();tickToday(n);S.acc+=n-S.startAt;S.running=false;save();wake(false);ui()}

/* ---------- 딴짓 감지: 다른 앱·탭 3초 → 사이렌 2초 + 10초 정지 ---------- */
const GRACE=3000,PENALTY=10000;
function sirenUrl(){
  const sr=22050,n=sr*2,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  let ph=0;
  for(let i=0;i<n;i++){const t=i/sr,f=650+650*(.5-.5*Math.cos(2*Math.PI*t*2));ph+=2*Math.PI*f/sr;
    const s=(Math.sin(ph)>0?.45:-.45)+.25*Math.sin(ph*2),env=Math.min(1,t/.03,(2-t)/.08);
    v.setInt16(44+i*2,Math.max(-1,Math.min(1,s*env))*30000,true)}
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
const sirenEl=new Audio(sirenUrl());sirenEl.preload='auto';
let audioReady=false,hiddenAt=0,graceT=0;
function unlockAudio(){
  if(audioReady)return;
  try{sirenEl.muted=true;const p=sirenEl.play();
    if(p)p.then(()=>{sirenEl.pause();sirenEl.currentTime=0;sirenEl.muted=false;audioReady=true}).catch(()=>{sirenEl.muted=false})}catch(e){}
}
document.addEventListener('pointerdown',unlockAudio);
function siren(){
  try{sirenEl.muted=false;sirenEl.currentTime=0;const p=sirenEl.play();if(p)p.catch(()=>{})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,100,300,100,300,100,300])}catch(e){}
  const f=$('#flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');setTimeout(()=>f.classList.remove('on'),2100);
}
function trip(at){
  clearTimeout(graceT);graceT=0;
  if(!S.running||!S.guard)return;
  if(typeof at!=='number')at=Math.min(Date.now(),hiddenAt+GRACE);
  tickToday(at);S.acc+=at-S.startAt;S.running=false;S.locked=true;S.lockUntil=at+PENALTY;
  S.today.strikes=(S.today.strikes||0)+1;
  save();siren();ui();
}
const unlockHooks=[];
function unlock(now){S.locked=false;S.running=true;S.startAt=now;S.lastTick=now;save();wake(true);ui();unlockHooks.forEach(h=>h())}
function lap(){const t=elapsed(Date.now());if(t<1000)return;const prev=S.laps.length?S.laps[0].total:0;S.laps.unshift({total:t,split:t-prev});save();renderLaps()}
function reset(){if(S.running)pause();S.locked=false;S.acc=0;S.laps=[];save();disarm();ui();renderLaps()}
function disarm(){clearTimeout(armTimer);armTimer=0;resetB.textContent='리셋';resetB.classList.remove('warn')}
goB.onclick=()=>{unlockAudio();if(S.locked){S.locked=false;save();ui();return}S.running?pause():start()};
const guardB=$('#guard');
guardB.onclick=()=>{unlockAudio();S.guard=!S.guard;if(!S.guard){clearTimeout(graceT);graceT=0}save();ui()};
lapB.onclick=lap;
resetB.onclick=()=>{
  if(elapsed(Date.now())===0&&!S.laps.length)return;
  if(armTimer){reset();return}
  resetB.textContent='한 번 더 누르면 리셋';resetB.classList.add('warn');
  armTimer=setTimeout(disarm,2500);
};
if(!document.fullscreenEnabled)fsB.style.display='none';
fsB.onclick=()=>{
  try{
    if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  }catch(e){}
};
document.addEventListener('fullscreenchange',()=>{fsB.textContent=document.fullscreenElement?'창 모드':'전체화면'});
document.addEventListener('visibilitychange',()=>{
  const now=Date.now();
  if(document.visibilityState==='hidden'){
    if(S.running&&S.guard){hiddenAt=now;clearTimeout(graceT);graceT=setTimeout(trip,GRACE)}
  }else{
    if(graceT){if(now-hiddenAt>=GRACE)trip();else{clearTimeout(graceT);graceT=0}}
    if(S.running)wake(true);
  }
  save();
});
addEventListener('pagehide',save);

function ui(){
  const t=elapsed(Date.now());
  goB.textContent=S.running||S.locked?'정지':(t>0?'계속':'시작');
  goB.classList.toggle('on',S.running);
  const st=$('#status');
  st.classList.toggle('run',S.running);st.classList.toggle('pause',!S.running&&!S.locked&&t>0);st.classList.toggle('lock',S.locked);
  $('#state').textContent=S.locked?lockText(Date.now()):S.running?'측정 중':(t>0?'일시정지':'대기');
  lapB.disabled=t<1000&&!S.running;
  guardB.textContent='딴짓 감지 '+(S.guard?'켬':'끔');guardB.classList.toggle('on',S.guard);
  $('#rule').style.visibility=S.guard?'visible':'hidden';
  $('#strikes').textContent=S.today.date===dayKey(new Date())?(S.today.strikes||0):0;
  dKey='';
}
const lockText=now=>'딴짓 감지! '+Math.max(1,Math.ceil((S.lockUntil-now)/1000))+'초 뒤 재개';
function renderLaps(){
  const L=S.laps,el=$('#laps');
  $('#lapcount').textContent=L.length?'랩 '+L.length+'개':'';
  el.innerHTML=L.length?L.map((l,i)=>`<li><span>랩 ${L.length-i}</span><span class="mono sp">+${fmt(l.split)}</span><span class="mono">${fmt(l.total)}</span></li>`).join('')
    :'<li class="empty">랩을 누르면 구간 기록이 여기 쌓여요</li>';
}

/* ---------- LED 숫자 ---------- */
const F5={'0':['01110','10001','10011','10101','11001','10001','01110'],'1':['00100','01100','00100','00100','00100','00100','01110'],
'2':['01110','10001','00001','00010','00100','01000','11111'],'3':['11111','00010','00100','00010','00001','10001','01110'],
'4':['00010','00110','01010','10010','11111','00010','00010'],'5':['11111','10000','11110','00001','00001','10001','01110'],
'6':['00110','01000','10000','11110','10001','10001','01110'],'7':['11111','00001','00010','00100','01000','01000','01000'],
'8':['01110','10001','10001','01110','10001','10001','01110'],'9':['01110','10001','10001','01111','00001','00010','01100'],
':':['0','0','1','0','1','0','0']};
const dc=$('#dc'),dx=dc.getContext('2d');
let dKey='';
function drawDigits(now,force){
  const str=fmt(elapsed(now)),blink=S.running&&now%1000>=500,k=str+blink+S.running+S.locked;
  if(k===dKey&&!force)return;dKey=k;
  const dpr=devicePixelRatio||1,w=dc.clientWidth,h=dc.clientHeight;
  if(dc.width!==Math.round(w*dpr)||dc.height!==Math.round(h*dpr)){dc.width=Math.round(w*dpr);dc.height=Math.round(h*dpr)}
  dx.setTransform(dpr,0,0,dpr,0,0);dx.clearRect(0,0,w,h);
  const chars=[...str],cols=chars.reduce((a,c)=>a+(c===':'?1:5),0)+chars.length-1;
  const cell=Math.max(2,Math.floor(Math.min(w/cols,h/7))),ch=Math.max(2,Math.floor(Math.min(h/11,cell*1.4)));
  const dot=Math.max(1,Math.round(cell*.84)),doth=Math.max(1,Math.round(ch-cell*.16));
  const refl=h/ch>=10.5,x0=Math.round((w-cols*cell)/2),y0=Math.round((h-(refl?10.5:7)*ch)/2);
  const on=[],off=[];let cx=0;
  for(const c of chars){
    const m=F5[c],cw=m[0].length;
    for(let r=0;r<7;r++)for(let q=0;q<cw;q++){
      const lit=m[r][q]==='1'&&!(c===':'&&blink);
      (lit?on:off).push([x0+(cx+q)*cell,y0+r*ch,r]);
    }
    cx+=cw+1;
  }
  dx.fillStyle='rgba(120,150,255,.07)';for(const p of off)dx.fillRect(p[0],p[1],dot,doth);
  const live=S.running||elapsed(now)===0,col=S.locked?'#ff6f88':live?'#c6eeff':'#ffd9e0';
  if(refl){const base=y0+7*ch+ch*.6,rh=Math.max(1,Math.round(doth*.42));
    for(const p of on){const d=6-p[2];dx.globalAlpha=.2*(1-d/7.5);dx.fillStyle=col;
      const ry=Math.round(base+d*ch*.45),wob=(p[2]%2?1:-1)*Math.round(cell*.08);dx.fillRect(p[0]+wob,ry,dot,rh)}
    dx.globalAlpha=1}
  dx.shadowColor=S.locked?'rgba(255,40,80,.95)':live?'rgba(86,198,255,.85)':'rgba(200,64,90,.7)';dx.shadowBlur=cell*.9;
  dx.fillStyle=col;
  for(const p of on)dx.fillRect(p[0],p[1],dot,doth);
  dx.shadowBlur=0;
}

/* ---------- 픽셀 풍경 ---------- */
const W=120,H=160;
const sc=$('#scene'),g=sc.getContext('2d');
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
const back=mk(),front=mk(),bk=back.getContext('2d'),fr=front.getContext('2d');
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const rgba=(h,a)=>{const c=hex(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`};
const R=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
const P1=(c,x,y,col)=>R(c,x,y,1,1,col);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

const PERIODS=[
 {id:'dawn',name:'새벽',span:'04–07시',from:4,to:7,cap:'새벽, 벤치에서 꾸벅꾸벅',sky:['#0c1233','#2c2d60','#c07a8c'],far:'#2b2a55',mid:'#1f1e42',near:'#161533',ground:'#121430',win:.12,neon:.5,lamp:1,stars:.4,moon:1,sun:0,rain:22,dark:.85,pose:'sit'},
 {id:'morning',name:'아침',span:'07–12시',from:7,to:12,cap:'아침, 따뜻한 커피 한 잔',sky:['#6683a8','#9cb0c6','#e2d5c3'],far:'#8996aa',mid:'#5b687e',near:'#47526a',ground:'#363e50',win:.03,neon:0,lamp:0,stars:0,moon:0,sun:0,rain:28,dark:.25,pose:'coffee'},
 {id:'day',name:'낮',span:'12–17시',from:12,to:17,cap:'오후, 손바닥으로 빗방울 받기',sky:['#71818f','#97a2ad','#c0c6ca'],far:'#8a949e',mid:'#626d7a',near:'#4c5663',ground:'#3c434e',win:.04,neon:0,lamp:0,stars:0,moon:0,sun:0,rain:48,dark:.3,pose:'catch'},
 {id:'evening',name:'저녁',span:'17–21시',from:17,to:21,cap:'저녁, 헤드폰 끼고 노을 구경',sky:['#221944','#7b3a6a','#f0894c'],far:'#3b2547',mid:'#291a3e',near:'#1d1433',ground:'#1a1429',win:.22,neon:1,lamp:1,stars:.15,moon:0,sun:1,rain:40,dark:.8,pose:'music'},
 {id:'night',name:'밤',span:'21–04시',from:21,to:4,cap:'한밤, 네온 아래서 집에 가는 길',sky:['#05040f','#130c2b','#2e1742'],far:'#170f2c',mid:'#100b20',near:'#0b0917',ground:'#0b0a16',win:.34,neon:1,lamp:1,stars:1,moon:1,sun:0,rain:75,dark:1,pose:'pocket'}
];
const periodIdx=h=>PERIODS.findIndex(p=>p.from<p.to?h>=p.from&&h<p.to:h>=p.from||h<p.to);
const SCENES=['네온 거리','빗속 골목','육교 위'];

function sky(c,P,hz){
  const img=c.createImageData(W,hz),d=img.data,st=P.sky.map(hex),N=9;
  const at=t=>{const lo=t<.55,u=lo?t/.55:(t-.55)/.45,A=lo?st[0]:st[1],B=lo?st[1]:st[2];return A.map((v,i)=>v+(B[i]-v)*u)};
  const bands=[...Array(N)].map((_,i)=>at(i/(N-1)));
  for(let y=0;y<hz;y++){const f=y/(hz-1)*(N-1),b0=Math.floor(f),fr=f-b0;
    for(let x=0;x<W;x++){const col=bands[Math.min(N-1,b0+(fr>(BAY[(y&3)*4+(x&3)]+.5)/16?1:0))],o=(y*W+x)*4;d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=255}}
  c.putImageData(img,0,0);
}
function stars(c,P,rnd,maxY){const n=Math.round(46*P.stars);for(let i=0;i<n;i++)P1(c,rnd()*W|0,rnd()*maxY|0,rnd()<.25?'#ffffff':mix(P.sky[0],'#ffffff',.5))}
function moon(c,x,y,r,col,skyc){
  for(let dy=-r-3;dy<=r+3;dy++)for(let dx=-r-3;dx<=r+3;dx++){const d=Math.hypot(dx,dy);
    if(d<=r)P1(c,x+dx,y+dy,col);else if(d<=r+3&&BAY[((y+dy)&3)*4+((x+dx)&3)]<5)P1(c,x+dx,y+dy,mix(skyc,col,.3))}
  const cr=mix(col,'#7a7090',.25);P1(c,x-2,y-1,cr);R(c,x+1,y+1,2,1,cr);P1(c,x-1,y+3,cr);
}
function sun(c,x,y,r){for(let dy=-r;dy<=0;dy++)for(let dx=-r;dx<=r;dx++){const d=Math.hypot(dx,dy);
  if(d<=r)P1(c,x+dx,y+dy,mix('#ffe3a0','#ff8a55',(dy+r)/r));else if(d<=r+3&&BAY[((y+dy)&3)*4+((x+dx)&3)]<6)P1(c,x+dx,y+dy,'#f7a36a')}}
function skyline(c,P,rnd,base,minH,maxH,col,winP,blinks){
  let x=-2;
  while(x<W){const w=5+(rnd()*9|0),h=minH+(rnd()*(maxH-minH)|0),top=base-h;
    R(c,x,top,w,h,col);
    if(blinks&&rnd()<.22&&h>maxH*.6){R(c,x+(w>>1),top-4,1,4,col);blinks.push({x:x+(w>>1),y:top-5,ph:rnd()*6})}
    for(let yy=top+2;yy<base-1;yy+=3)for(let xx=x+1;xx<x+w-1;xx+=2)if(rnd()<winP)P1(c,xx,yy,rnd()<.7?mix('#ffd58a',col,.25):mix('#9fe6ff',col,.3));
    x+=w+(rnd()<.3?1:0);
  }
}
function building(c,P,rnd,x,y,w,h,col,winP){
  R(c,x,y,w,h,col);R(c,x,y,w,1,mix(col,'#ffffff',.1));
  const glass=P.win<.1?mix(col,P.sky[1],.3):mix(col,'#000000',.35);
  for(let yy=y+4;yy<y+h-8;yy+=6)for(let xx=x+2;xx<x+w-3;xx+=5){
    const lit=rnd()<winP;R(c,xx,yy,3,3,lit?(rnd()<.75?'#ffcf7a':'#8fd8ff'):glass);
    if(lit&&rnd()<.4)R(c,xx,yy+2,3,1,'#a87a3a');
  }
}
function ground(c,P,gy,rnd){
  for(let y=gy;y<H;y++)R(c,0,y,W,1,mix(mix(P.ground,P.sky[2],.16),P.ground,(y-gy)/(H-gy)));
  R(c,0,gy,W,1,mix(P.ground,'#ffffff',.14));R(c,0,gy+6,W,1,mix(P.ground,'#000000',.3));
  for(let i=0;i<5;i++){const px=rnd()*W|0,py=gy+10+(rnd()*(H-gy-14)|0),w=10+(rnd()*18|0);
    R(c,px,py,w,1,mix(P.ground,P.sky[2],.32));R(c,px+2,py+1,w-4,1,mix(P.ground,P.sky[2],.2))}
}
const TF={A:'010101111101101',B:'110101110101110',C:'011100100100011',E:'111100110100111',F:'111100110100100',H:'101101111101101',L:'100100100100111',O:'010101101101010',T:'111010010010010','2':'110001010100111','4':'101101111001001',R:'110101110101101'};
function text3(c,s,x,y,col,vert){[...s].forEach((ch,i)=>{const m=TF[ch],ox=vert?x:x+i*4,oy=vert?y+i*6:y;for(let k=0;k<15;k++)if(m[k]==='1')P1(c,ox+k%3,oy+(k/3|0),col)})}
function sign(c,s,on){R(c,s.x,s.y,s.w,s.h,'#0d0a14');
  const b=on?mix(s.col,'#000000',.25):'#2a2433';R(c,s.x,s.y,s.w,1,b);R(c,s.x,s.y+s.h-1,s.w,1,b);R(c,s.x,s.y,1,s.h,b);R(c,s.x+s.w-1,s.y,1,s.h,b);
  text3(c,s.text,s.x+2,s.y+2,on?s.col:'#3d3446',s.vert)}
function lampPost(c,x,y,gy){R(c,x,y,1,gy-y+4,'#1b1826');R(c,x-5,y-2,6,1,'#1b1826');R(c,x-6,y-1,3,2,'#2a2533')}

/* ---------- 셀캠 시선 감지 (MediaPipe Face Landmarker, 기기 안에서만 처리) ---------- */
const MP=window.__MP_BASE||'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.2';
const MODEL=window.__MP_MODEL||'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const cv=$('#cv'),camB=$('#camB'),calB=$('#calB'),sensB=$('#sensB'),camst=$('#camst'),camtxt=$('#camtxt'),meter=$('#meter');
const SENS=[['낮음',1.45],['보통',1],['높음',.7]];
if(S.sens==null)S.sens=1;
let lmk=null,stream=null,camOn=false,calib=null,awaySince=0,okSince=0,lastDet=0,camLoopId=0;
function camSay(t,cls,m){if(camtxt.textContent!==t)camtxt.textContent=t;camst.className='camst'+(cls?' '+cls:'');meter.style.width=Math.round(Math.min(1,m||0)*100)+'%'}
function camUi(){camB.textContent=camOn?'캠 끄기':'캠 켜기';calB.hidden=!camOn;sensB.hidden=!camOn;sensB.textContent='감도 '+SENS[S.sens][0];cv.classList.toggle('off',!camOn)}
async function loadLM(){
  if(lmk)return lmk;
  const {FaceLandmarker,FilesetResolver}=await import(MP+'/vision_bundle.mjs');
  const files=await FilesetResolver.forVisionTasks(MP+'/wasm');
  const make=d=>FaceLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true});
  try{lmk=await make('GPU')}catch(e){lmk=await make('CPU')}
  return lmk;
}
async function camStart(){
  if(camOn)return;
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camSay('https 주소에서 열어야 카메라를 쓸 수 있어요','bad');return}
  camOn=true;camUi();camSay('카메라 켜는 중…');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    cv.srcObject=stream;await cv.play().catch(()=>{});
    camSay('얼굴 인식 모델 불러오는 중…');
    await loadLM();
    if(!camOn)return;
    S.cam=true;save();
    if(!S.camBase)calibrate();else camSay('기준 불러옴','ok');
    camLoop();
  }catch(e){
    camStop(true);
    camSay(e&&e.name==='NotAllowedError'?'카메라 권한이 거부됐어요 · 주소창에서 허용해 주세요':'카메라를 켤 수 없어요 ('+((e&&e.name)||'오류')+')','bad');
  }
}
function camStop(keepMsg){
  camOn=false;cancelAnimationFrame(camLoopId);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  cv.srcObject=null;awaySince=0;calib=null;
  if(!keepMsg){S.cam=false;save();camSay('캠 꺼짐 · 영상은 기기 밖으로 안 나가요')}
  camUi();
}
function calibrate(){calib={until:Date.now()+3000,samples:[]};awaySince=0}
function feat(res){
  const L=res&&res.faceLandmarks&&res.faceLandmarks[0];if(!L)return null;
  const n=L[1],l=L[234],r=L[454],t=L[10],c=L[152],fw=r.x-l.x,fh=c.y-t.y;
  if(!(fw>0&&fh>0))return null;
  const b={},cats=res.faceBlendshapes&&res.faceBlendshapes[0]?res.faceBlendshapes[0].categories:[];
  for(const k of cats)b[k.categoryName]=k.score;
  const g=k=>b[k]||0;
  return{yaw:(n.x-(l.x+r.x)/2)/fw,pitch:(n.y-t.y)/fh,
    gx:((g('eyeLookOutLeft')-g('eyeLookInLeft'))-(g('eyeLookOutRight')-g('eyeLookInRight')))/2,
    gy:((g('eyeLookUpLeft')+g('eyeLookUpRight'))-(g('eyeLookDownLeft')+g('eyeLookDownRight')))/2,
    closed:(g('eyeBlinkLeft')+g('eyeBlinkRight'))/2};
}
function score(f){
  const b=S.camBase,k=SENS[S.sens][1],shut=f.closed>Math.max(.7,b.closed+.35)?1.5:0;
  return Math.max(Math.abs(f.yaw-b.yaw)/(.13*k),Math.abs(f.pitch-b.pitch)/(.07*k),Math.abs(f.gx-b.gx)/(.4*k),Math.abs(f.gy-b.gy)/(.4*k),shut);
}
function camLoop(){
  if(!camOn)return;
  camLoopId=requestAnimationFrame(camLoop);
  const now=Date.now();
  if(now-lastDet<100||cv.readyState<2||!lmk)return;
  lastDet=now;
  let res;try{res=lmk.detectForVideo(cv,performance.now())}catch(e){return}
  const f=feat(res);
  if(calib){
    if(!f){calib.until=now+3000;calib.samples=[];camSay('얼굴이 안 보여요 · 카메라 각도를 맞춰 주세요','bad');return}
    calib.samples.push(f);
    camSay('평소 공부 자세로 가만히… '+Math.max(1,Math.ceil((calib.until-now)/1000)),'ok',1-(calib.until-now)/3000);
    if(now>=calib.until&&calib.samples.length>=8){
      const s=calib.samples,avg=k=>s.reduce((a,x)=>a+x[k],0)/s.length;
      S.camBase={yaw:avg('yaw'),pitch:avg('pitch'),gx:avg('gx'),gy:avg('gy'),closed:avg('closed')};calib=null;save();
    }
    return;
  }
  if(!S.camBase)return;
  const sc=f?score(f):2,away=sc>1;
  if(away){okSince=0;if(!awaySince)awaySince=now}else{if(!okSince)okSince=now;if(now-okSince>400)awaySince=0}
  const watching=S.running&&S.guard&&!S.locked;
  if(awaySince&&now-awaySince>250)camSay((f?'시선 이탈 ':'얼굴 안 보임 ')+((now-awaySince)/1000).toFixed(1)+'초','bad',sc);
  else camSay(S.locked?'벌칙 10초 중':watching?'집중 중':S.guard?'대기 · 측정 중에만 감시해요':'딴짓 감지 꺼짐','ok',sc);
  if(awaySince&&watching&&now-awaySince>=GRACE){awaySince=0;trip(now)}
}
camB.onclick=()=>{unlockAudio();camOn?camStop():camStart()};
calB.onclick=()=>{unlockAudio();if(camOn&&lmk)calibrate()};
sensB.onclick=()=>{S.sens=(S.sens+1)%SENS.length;save();camUi()};
unlockHooks.push(()=>{if(awaySince)awaySince=Date.now()});
camUi();
if(S.cam)camStart();

ui();renderLaps();fitScene();
requestAnimationFrame(loop);
}
</script>
</body>
</html>
